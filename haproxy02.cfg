global
    log stdout format raw local0
    maxconn 1000
	user haproxy
	group haproxy

defaults
	log 	global
	mode 	http
	option	httplog
	option	dontlognull
	timeout connect 5s
	timeout client  30s
	timeout server  30s
	timeout check 5s

frontend web
	bind *:81
	default_backend backend_web

backend backend_web
	balance roundrobin
	server f01 f01:82 check
	server f02 f02:83 check

frontend stats
    bind *:7001
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
